<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191824">
  <title>Мира</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/remote.css">
  <script defer src="/remote.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="/icon-192.png" alt="" width="42" height="42">
      <h1>Мира</h1>
      <button id="disconnect" type="button" hidden>Выйти</button>
    </header>
    <section id="connection">
      <h2>Подключение к ноутбуку</h2>
      <form id="connect">
        <label for="code">Код из окна Миры на Windows</label>
        <input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button type="submit">Подключиться</button>
      </form>
    </section>
    <section id="chat" hidden>
      <div id="messages" role="log" aria-live="polite"></div>
      <form id="command">
        <label for="message">Вопрос или команда</label>
        <textarea id="message" rows="2" maxlength="4000" placeholder="Например, Мира, открой YouTube"></textarea>
        <div class="controls">
          <button id="mic" type="button" aria-pressed="false">Микрофон</button>
          <button type="submit">Отправить</button>
        </div>
      </form>
    </section>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
